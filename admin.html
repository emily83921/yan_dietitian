<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>代謝卡關後台</title>
<meta name="robots" content="noindex,nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap">
<style>
/* Layout: 營養師的個案夾（黑底粉色點綴，單一深色配色）。左邊是填答名單，右邊打開一位個案的完整檔案；手機上兩欄改成先列表、點進去看檔案。 */
:root{
  color-scheme:light;
  --bg:#FFF7F9; --paper:#FFFFFF; --sunk:#FFF0F4; --ink:#2E1A24; --muted:#7D6470; --line:#F5DCE5;
  --espresso:#2E1A24; --espresso-ink:#FFFFFF; --sage:#22A06B; --gold:#FF3D7A; --gold-soft:#FFE6EE;
  --st-new:#E5484D; --st-done:#22A06B; --st-won:#E08A1E; --st-skip:#B49AA6;
  --f-zh:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; --f-en:"Playfair Display","Times New Roman",serif;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.65;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--espresso)}
h1,h2,h3{margin:0;font-family:var(--f-zh);font-weight:700;color:var(--espresso);line-height:1.35}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.en{font-family:var(--f-en);font-style:italic;color:var(--gold)}
.g{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--espresso)}
.btn-dark{background:var(--espresso);color:var(--espresso-ink);border-color:var(--espresso)}
.btn[disabled]{opacity:.6;cursor:progress}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding-block:40px}
.login form{background:var(--paper);border:1px solid var(--line);padding:36px 30px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.login h1{font-size:24px}
.login .input{border-bottom:1px solid var(--line);display:flex}
.login input{border:0;background:transparent;width:100%;padding:10px 0;font-size:16px}
.login input:focus{outline:none}
.login .btn-dark{justify-content:center;padding:12px}
.err{color:var(--st-new);font-size:13.5px}
.demo{background:var(--gold-soft);padding:10px 14px;font-size:13px}

/* app */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--espresso);color:var(--espresso-ink);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.top h1{color:var(--espresso-ink);font-size:19px;display:flex;align-items:baseline;gap:10px}
.top h1 .en{font-size:15px}
.top .acts{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.kpi{padding:16px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.kpi:last-child{border-right:0}
.kpi span{font-size:12px;color:var(--muted);letter-spacing:.06em}
.kpi b{font-family:var(--f-zh);font-size:28px;font-weight:600;line-height:1.15;color:var(--espresso);font-variant-numeric:tabular-nums}
.layout{display:grid;grid-template-columns:minmax(300px,380px) 1fr;min-height:calc(100% - 160px)}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.filters{padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);background:var(--paper)}
.filters input,.filters select{border:1px solid var(--line);background:var(--paper);padding:8px 10px;font-size:13.5px;width:100%}
.filters .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list{overflow:auto;flex:1}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:3px solid transparent;width:100%;text-align:left;border-top:0;border-right:0}
.item:hover{background:var(--sunk)}
.item.on{background:var(--paper);border-left-color:var(--espresso)}
.item b{font-family:var(--f-zh);font-size:16px;color:var(--espresso)}
.item .meta{grid-column:1/-1;font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.st{font-size:12px;padding:1px 9px;border:1px solid currentColor;white-space:nowrap;align-self:center}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.detail{min-width:0;padding:28px 32px 60px;display:flex;flex-direction:column;gap:24px}
.d-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;align-items:flex-end;padding-bottom:18px;border-bottom:1px solid var(--espresso)}
.d-head h2{font-size:28px}
.d-head small{color:var(--muted);font-size:12.5px;letter-spacing:.06em}
.d-head .back{display:none}
.status-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status-row select{border:1px solid var(--line);background:var(--paper);padding:8px 10px}
.blk{display:flex;flex-direction:column;gap:12px}
.blk h3{font-size:16px;display:flex;align-items:baseline;gap:10px}
.blk h3 .en{font-size:14px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.kv div{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.kv span{font-size:12px;color:var(--muted)}
.kv b{font-weight:500;font-size:15px;overflow-wrap:anywhere}
.kv b.num{font-family:var(--f-en);font-size:24px;font-weight:600;line-height:1.2}
.contact{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.contact div{display:grid;grid-template-columns:6em 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.contact span{color:var(--muted);font-size:12.5px}
.contact b{font-weight:500;overflow-wrap:anywhere}
.contact a{color:inherit}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:7em 1fr 2.4em;gap:12px;align-items:center;font-size:13.5px}
.bar .tr{height:4px;background:var(--line)}
.bar .fl{height:100%}
.bar .p{font-family:var(--f-en);font-size:17px;font-weight:600;text-align:right}
.answers{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.answers div{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.answers span{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--gold-soft);padding:3px 10px;font-size:13px}
textarea{border:1px solid var(--line);background:var(--paper);padding:10px 12px;width:100%;min-height:96px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--espresso);color:var(--espresso-ink);padding:10px 18px;font-size:13.5px;z-index:50}
@media (max-width:860px){
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(2){border-right:0}
  .kpi:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .layout{grid-template-columns:1fr}
  .side{border-right:0}
  .layout.open .side{display:none}
  .layout:not(.open) .detail{display:none}
  .detail{padding:20px 16px 48px}
  .d-head .back{display:inline-flex}
  .kv{grid-template-columns:1fr 1fr}
}
@media (max-width:480px){ .answers div{grid-template-columns:1fr;gap:0} .contact div{grid-template-columns:5em 1fr auto} }
</style>
<style>
.top .btn{background:transparent;color:var(--espresso-ink);border-color:rgba(255,244,246,.3)}
.top .en{color:#F7B6C8}
.item b .em{margin-right:4px}
.typebadge{display:inline-flex;align-items:center;gap:6px;background:var(--espresso);color:#F7B6C8;border-radius:99px;padding:3px 12px;font-size:13px}
.kpi b small{font-size:13px;color:var(--muted);font-family:var(--f-body);font-weight:400;margin-left:4px}
.item,.btn,.st,textarea,.filters input,.filters select,.status-row select,.kv,.login form{border-radius:0}
.login form{border-radius:24px}
.btn{border-radius:99px}
</style>
<style>
/* 淺色版：和前台一致 */
body{background:radial-gradient(60% 40% at 100% 0%,rgba(255,179,138,.18),transparent 70%),radial-gradient(50% 35% at 0% 20%,rgba(201,168,255,.14),transparent 70%),var(--bg);background-attachment:fixed}
body::before{background:var(--bg)}
h1,h2,h3{font-weight:900}
.top{background:rgba(255,247,249,.92);backdrop-filter:blur(10px);color:var(--ink);border-bottom:1px solid var(--line)}
.top h1{color:var(--ink)}
.top .en{color:var(--gold)}
.top .btn{background:#fff;color:var(--ink);border-color:var(--line)}
.btn{background:#fff}
.btn-dark{background:linear-gradient(135deg,#FF5C8D,#FF3D7A);color:#fff;border-color:transparent}
.login form{box-shadow:0 14px 40px rgba(255,92,141,.12);border-radius:28px}
.login .input{border:1px solid var(--line);border-radius:14px;padding:0 14px;background:#fff}
.demo{background:var(--gold-soft);color:var(--ink);border-radius:12px}
.kpis{gap:12px;padding:16px max(20px,env(safe-area-inset-left,0px));border-bottom:0}
.kpi{background:#fff;border:1px solid var(--line)!important;border-radius:20px;box-shadow:0 8px 24px rgba(255,92,141,.06)}
.kpi b{color:var(--ink);font-weight:900}
.kpi:first-child{background:linear-gradient(135deg,#FF5C8D,#FF3D7A);border-color:transparent!important}
.kpi:first-child span,.kpi:first-child b{color:#fff}
.layout{margin:0 max(20px,env(safe-area-inset-left,0px)) 24px;background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 10px 30px rgba(255,92,141,.06)}
.filters{background:var(--sunk)}
.filters input,.filters select,.status-row select,textarea{border-radius:12px!important;background:#fff}
.item.on{background:var(--sunk);border-left-color:var(--gold)}
.item b{color:var(--ink)}
.st{border-radius:99px!important}
.d-head{border-bottom:1px solid var(--line)}
.typebadge{background:var(--gold-soft);color:var(--gold);font-weight:700}
.kv{border-radius:14px;overflow:hidden}
.kv b.num{font-family:"DM Mono",ui-monospace,monospace;color:var(--ink)}
.bar .tr{border-radius:99px;background:var(--sunk)}.bar .fl{border-radius:99px}
.chip{border-radius:99px;background:var(--gold-soft)}
.toast{background:var(--ink);color:#fff;border-radius:99px}
.tabs{display:flex;gap:8px;padding:14px max(20px,env(safe-area-inset-left,0px)) 0}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 18px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button b{font-family:"DM Mono",monospace;margin-left:6px;font-weight:500}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.worry{background:var(--sunk);border-radius:14px;padding:12px 14px;white-space:pre-wrap}
@media (max-width:860px){.kpis{grid-template-columns:1fr 1fr}.kpi{border-bottom:1px solid var(--line)!important}}
</style>

</head>
<body>
<div id="loginView" class="login g">
  <form id="loginForm" novalidate>
    <span class="en" style="font-size:16px">Client Files</span>
    <h1>Brighter Me 後台</h1>
    <p style="color:var(--muted);font-size:13.5px">輸入你在 Google Apps Script 設定的後台密碼。</p>
    <label class="input"><input id="key" type="password" autocomplete="current-password" placeholder="後台密碼"></label>
    <p class="err" id="loginErr" role="alert" hidden></p>
    <button class="btn btn-dark" type="submit" id="loginBtn">進入後台</button>
    <p class="demo js-demo" hidden>目前還沒貼上 Apps Script 網址，直接按「進入後台」會顯示範例資料。</p>
  </form>
</div>

<div id="appView" hidden style="height:100%;display:flex;flex-direction:column">
  <header class="top g">
    <div class="in">
      <h1>Brighter Me 後台 <span class="en">Client Files</span></h1>
      <div class="acts">
        <button class="btn" type="button" id="refresh">重新整理</button>
        <a class="btn js-sheet" href="#" target="_blank" rel="noopener" hidden>開啟試算表</a>
        <button class="btn" type="button" id="logout">登出</button>
      </div>
    </div>
  </header>
  <p class="demo js-demo g" hidden style="padding-block:10px">這是範例資料，用來預覽後台的樣子。貼上 Apps Script 網址後就會顯示真實填答。</p>
  <nav class="tabs" id="tabs"><button type="button" data-m="quiz" class="on">檢測填答<b id="nQuiz">0</b></button><button type="button" data-m="book">預約諮詢<b id="nBook">0</b></button></nav>
  <div class="kpis" id="kpis"></div>
  <div class="layout" id="layout">
    <aside class="side">
      <div class="filters">
        <input id="q" type="search" placeholder="搜尋 Email 或型態">
        <div class="row">
          <select id="fStatus"><option value="">全部狀態</option></select>
          <select id="fType"><option value="">全部型態</option></select>
        </div>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <section class="detail" id="detail"></section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============================================================
   ✏️ 貼上和評估網站一樣的 Apps Script 網址；試算表網址可選填
   ============================================================ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0Nxt96fvNhbqZiAakp7eYNWfbSMcsAAE0RSGLydxpFaMZBCofaEoE5UUoWgVhEe4yiA/exec";
const SHEET_LINK = "https://docs.google.com/spreadsheets/d/1LWcy7e5Oe6kcSZPDLhZhbvUQyp8_ghPetr155U3HY4g/edit";
/* ============================================================ */

const STATUSES = ["未聯繫","已聯繫","已成交","不需追蹤"];
const ST_COLOR = {"未聯繫":"--st-new","已聯繫":"--st-done","已成交":"--st-won","不需追蹤":"--st-skip"};
const TYPE_EM = {};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const show = v => (v===undefined||v===null||v==="") ? "—" : v;
const DEMO = !SCRIPT_URL;
let KEY="", ROWS=[], BOOKS=[], MODE="quiz", CUR=null, lastError="";
const DATA=()=>MODE==="book"?BOOKS:ROWS, TK=()=>MODE==="book"?"型態":"主要型態", TT=()=>MODE==="book"?"預約時間":"填寫時間";

const SAMPLE = [
  {"編號":"範例-001","填寫時間":"2026-10-21 21:14","狀態":"未聯繫","備註":"","Email":"mei@example.com","報告寄送":"已寄出","主要型態":"血糖起伏型","次要型態":"節食耗損型","性別":"女","年齡":"29","身高":"160","體重":"62","體脂率":"31","腰圍":"81","目標體重":"55","目標":"減脂、穩定血糖","活動量":"輕度工作","飲食型態":"葷食","健康狀況":"便秘或腸胃不適","過敏或不吃":"蝦","指數｜血糖起伏型":"78","指數｜高壓緊繃型":"30","指數｜節食耗損型":"52","指數｜作息失衡型":"33","指數｜情緒飢餓型":"40","指數｜代謝低速型":"67","BMI":"24.2","基礎代謝":"1290","維持熱量":"1548","建議熱量":"1290","蛋白質g":"93","全天醣類份數":"7","理想體重":"47–61 kg","營養素分配":"碳水 127 g／蛋白質 93 g／脂肪 52 g","減脂節奏":"每週 −0.4 kg，約 18 週，到 55 kg","報告編號":"482913","來源連結":"utm_source=ig","同意蒐集":"是","題目｜手搖飲、含糖飲料，一週喝幾杯？":"3 到 5 杯","題目｜關於甜點和零食，哪個最像你？":"正餐吃飽了，還是要來點甜的","題目｜你通常幾點睡？":"12 點到 1 點"},
  {"編號":"範例-002","填寫時間":"2026-10-20 12:40","狀態":"已聯繫","備註":"已私訊，週五回覆菜單","Email":"kai@example.com","報告寄送":"已寄出","主要型態":"高壓緊繃型","次要型態":"","性別":"男","年齡":"34","身高":"175","體重":"78","體脂率":"","腰圍":"","目標體重":"","目標":"增肌","活動量":"中度工作","飲食型態":"葷食","健康狀況":"無","過敏或不吃":"","指數｜血糖起伏型":"11","指數｜高壓緊繃型":"64","指數｜節食耗損型":"20","指數｜作息失衡型":"22","指數｜情緒飢餓型":"13","指數｜代謝低速型":"17","BMI":"25.5","基礎代謝":"1724","維持熱量":"2672","建議熱量":"2872","蛋白質g":"140","全天醣類份數":"10","報告編號":"118264","來源連結":"","同意蒐集":"是"},
  {"編號":"範例-003","填寫時間":"2026-10-14 22:05","狀態":"已成交","備註":"報名一對一 4 週","Email":"jess@example.com","報告寄送":"未寄：10 分鐘內已寄過","主要型態":"情緒飢餓型","次要型態":"作息失衡型","性別":"女","年齡":"41","身高":"163","體重":"68","體脂率":"34","腰圍":"86","目標體重":"60","目標":"減脂、增肌","活動量":"輕度工作","飲食型態":"蛋奶素","健康狀況":"血糖偏高","過敏或不吃":"","指數｜血糖起伏型":"33","指數｜高壓緊繃型":"20","指數｜節食耗損型":"28","指數｜作息失衡型":"56","指數｜情緒飢餓型":"75","指數｜代謝低速型":"42","BMI":"25.6","基礎代謝":"1286","維持熱量":"1768","建議熱量":"1468","蛋白質g":"122","全天醣類份數":"7","報告編號":"770215","來源連結":"","同意蒐集":"是"},
];

async function api(body){
  const r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,key:KEY})});
  return r.json();
}
function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(t._t); t._t=setTimeout(()=>t.hidden=true,2200); }

document.querySelectorAll(".js-demo").forEach(el=>el.hidden=!DEMO);
if(SHEET_LINK){ const a=document.querySelector(".js-sheet"); a.href=SHEET_LINK; a.hidden=false; }
try{ KEY=sessionStorage.getItem("yan-admin-key")||""; }catch(e){}
$("fStatus").innerHTML+=STATUSES.map(s=>`<option>${s}</option>`).join("");

const SAMPLE_BOOK=[{"編號":"範例-B01","預約時間":"2026-10-22 18:20","狀態":"未聯繫","備註":"","稱呼":"（範例）小美","聯絡方式":"Instagram","聯絡帳號":"@example_mei","型態":"情緒飢餓型","想改變的":"減脂、瘦下來、外食也能瘦","試過的方法":"少吃、節食、斷食","三餐":"大多外食","最困擾的":"晚上很容易嘴饞，減了又復胖","方便時段":"平日晚上","來源":"減脂對策頁"}];
async function load(){
  if(DEMO){ ROWS=SAMPLE.map(r=>({...r})); BOOKS=SAMPLE_BOOK.map(r=>({...r})); return true; }
  try{ const res=await api({action:"list"}); if(!res.ok){ lastError=res.error==="密碼錯誤"?"密碼錯誤，請再試一次。":res.error; return false; } ROWS=res.rows||[];
    try{ const rb=await api({action:"listBook"}); BOOKS=rb.ok?(rb.rows||[]):[]; }catch(e){ BOOKS=[]; } return true; }
  catch(e){ lastError="連不上後台，請確認 Apps Script 網址和部署設定。"; return false; }
}
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault(); const err=$("loginErr"); err.hidden=true;
  if(!DEMO){ KEY=$("key").value.trim(); if(!KEY){ err.textContent="請輸入密碼。"; err.hidden=false; return; } }
  const b=$("loginBtn"); b.disabled=true; b.textContent="讀取中…";
  const ok=await load(); b.disabled=false; b.textContent="進入後台";
  if(!ok){ err.textContent=lastError; err.hidden=false; return; }
  try{ sessionStorage.setItem("yan-admin-key",KEY); }catch(e){}
  $("loginView").hidden=true; $("appView").hidden=false; renderAll();
});
$("logout").addEventListener("click",()=>{ KEY=""; try{ sessionStorage.removeItem("yan-admin-key"); }catch(e){} $("appView").hidden=true; $("loginView").hidden=false; $("key").value=""; });
$("refresh").addEventListener("click",async()=>{ const b=$("refresh"); b.disabled=true; if(await load()){ renderAll(); toast("已更新"); } else toast(lastError||"更新失敗"); b.disabled=false; });
if(KEY && !DEMO) load().then(ok=>{ if(ok){ $("loginView").hidden=true; $("appView").hidden=false; renderAll(); } });

["q","fStatus","fType"].forEach(id=>$(id).addEventListener("input",renderList));
$("tabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; MODE=b.dataset.m; CUR=null; $("tabs").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); $("q").placeholder=MODE==="book"?"搜尋稱呼、帳號或型態":"搜尋 Email 或型態"; $("layout").classList.remove("open"); renderAll(); });
function renderAll(){
  $("nQuiz").textContent=ROWS.length; $("nBook").textContent=BOOKS.length;
  const types=[...new Set(DATA().map(r=>r[TK()]).filter(Boolean))];
  const keep=$("fType").value;
  $("fType").innerHTML=`<option value="">全部型態</option>`+types.map(t=>`<option ${t===keep?"selected":""}>${esc(t)}</option>`).join("");
  renderKpis(); renderList();
  const r=CUR&&DATA().find(x=>x["編號"]===CUR); r?renderDetail(r):showEmpty();
}
function renderKpis(){
  const D=DATA(), now=Date.now(), week=D.filter(r=>{ const t=Date.parse((r[TT()]||"").replace(" ","T")+":00+08:00"); return t&&now-t<7*864e5; }).length;
  const cnt={}; D.forEach(r=>{ const t=r[TK()]; if(t) cnt[t]=(cnt[t]||0)+1; });
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  $("kpis").innerHTML=[[MODE==="book"?"總預約":"總填答",D.length],["近 7 天",week],["未聯繫",D.filter(r=>(r["狀態"]||"未聯繫")==="未聯繫").length],
    ["最多的型態",top?`${TYPE_EM[top[0]]||""}${esc(top[0])}<small>${top[1]} 人</small>`:"—"]]
    .map(([k,v])=>`<div class="kpi"><span>${k}</span><b>${v}</b></div>`).join("");
}
const nameOf=r=>MODE==="book"?(r["稱呼"]||"（未填稱呼）"):(r["Email"]||r["稱呼"]||"（未填 email）");
const contactOf=r=>MODE==="book"?[r["聯絡方式"]&&(r["聯絡方式"]+" "+(r["聯絡帳號"]||""))].filter(Boolean).join(""):[r["主要型態"],r["報告寄送"]&&("報告"+(String(r["報告寄送"]).startsWith("已寄")?"已寄出":"未寄出"))].filter(Boolean).join(" · ");
function renderList(){
  const q=$("q").value.trim().toLowerCase(), fs=$("fStatus").value, ft=$("fType").value;
  const rows=DATA().filter(r=>(!fs||(r["狀態"]||"未聯繫")===fs)&&(!ft||r[TK()]===ft)&&(!q||[r["Email"],r["稱呼"],r["Instagram"],r["聯絡帳號"],r[TK()]].join(" ").toLowerCase().includes(q)));
  $("list").innerHTML=rows.length?rows.map(r=>{ const st=r["狀態"]||"未聯繫"; return `<button type="button" class="item${r["編號"]===CUR?" on":""}" data-id="${esc(r["編號"])}">
    <b><span class="em">${TYPE_EM[r["主要型態"]]||""}</span>${esc(nameOf(r))}</b><span class="st" style="color:var(${ST_COLOR[st]||"--muted"})">${esc(st)}</span>
    <span class="meta"><span>${esc(r[TT()])}</span><span>${esc(r[TK()])}</span><span>${esc(contactOf(r))}</span></span></button>`; }).join("")
    :`<div class="empty"><b style="font-family:var(--f-zh)">${DATA().length?"沒有符合條件的資料":(MODE==="book"?"還沒有人預約":"還沒有人填寫")}</b><span>${DATA().length?"試試看調整搜尋或篩選。":(MODE==="book"?"有人從對策頁預約後，會出現在這裡。":"把測驗網址放到 IG 簡介，第一筆資料就會出現在這裡。")}</span></div>`;
}
$("list").addEventListener("click",e=>{ const b=e.target.closest(".item"); if(!b) return; CUR=b.dataset.id; renderList(); renderDetail(DATA().find(r=>r["編號"]===CUR)); $("layout").classList.add("open"); window.scrollTo({top:0}); });
function showEmpty(){ $("detail").innerHTML=`<div class="empty" style="margin-top:60px"><span class="en" style="font-size:22px">Select a client</span><span>從左邊點一位填答者，查看完整資料。</span></div>`; }

function bindSave(r){
  $("backBtn").addEventListener("click",()=>$("layout").classList.remove("open"));
  $("detail").querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",async()=>{ try{ await navigator.clipboard.writeText(b.dataset.copy); toast("已複製"); }catch(e){ toast("無法複製，請手動選取"); } }));
  $("saveBtn").addEventListener("click",async()=>{
    const status=$("stSel").value, note=$("note").value, b=$("saveBtn"); b.disabled=true; let ok=true;
    if(!DEMO){ try{ const res=await api({action:"update",id:r["編號"],status,note,sheet:MODE==="book"?"book":"data"}); ok=res.ok; if(!ok) toast(res.error||"儲存失敗"); }catch(e){ ok=false; toast("儲存失敗，請檢查網路"); } }
    if(ok){ r["狀態"]=status; r["備註"]=note; renderKpis(); renderList(); toast(DEMO?"範例模式：不會真的存檔":"已儲存"); }
    b.disabled=false;
  });
}
function renderBook(r){
  const st=r["狀態"]||"未聯繫";
  const copy=v=>v?`<button class="btn" type="button" data-copy="${esc(v)}">複製</button>`:"<span></span>";
  const acc=r["聯絡帳號"]||"", ig=r["聯絡方式"]==="Instagram"?acc.replace(/^@/,""):"";
  const link=ig?`<a href="https://www.instagram.com/${encodeURIComponent(ig)}/" target="_blank" rel="noopener">@${esc(ig)}</a>`:r["聯絡方式"]==="Email"?`<a href="mailto:${esc(acc)}">${esc(acc)}</a>`:esc(show(acc));
  const kv=arr=>`<div class="kv">${arr.map(([k,v])=>`<div><span>${k}</span><b>${esc(show(v))}</b></div>`).join("")}</div>`;
  $("detail").innerHTML=`
    <div class="d-head">
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="btn back" type="button" id="backBtn" style="align-self:flex-start;margin-bottom:6px">← 名單</button>
        <small>${esc(r["預約時間"])} · 來源 ${esc(show(r["來源"]))}</small>
        <h2>${esc(nameOf(r))}</h2>
        <span class="typebadge">${esc(show(r["型態"]))}</span>
      </div>
      <div class="status-row"><select id="stSel" aria-label="狀態">${STATUSES.map(s=>`<option ${s===st?"selected":""}>${s}</option>`).join("")}</select></div>
    </div>
    <div class="blk"><h3>聯絡方式 <span class="en">Contact</span></h3>
      <div class="contact"><div><span>${esc(show(r["聯絡方式"]))}</span><b>${link}</b>${copy(acc)}</div><div><span>方便時段</span><b>${esc(show(r["方便時段"]))}</b><span></span></div></div>
    </div>
    <div class="blk"><h3>預約問卷 <span class="en">Intake</span></h3>
      ${kv([["想改變的",r["想改變的"]],["試過的方法",r["試過的方法"]],["三餐",r["三餐"]]])}
    </div>
    <div class="blk"><h3>最困擾的 <span class="en">Concern</span></h3><p class="worry">${esc(show(r["最困擾的"]))}</p></div>
    <div class="blk"><h3>備註 <span class="en">Notes</span></h3>
      <textarea id="note" placeholder="例如：已私訊，約週六下午 2 點線上諮詢">${esc(r["備註"]||"")}</textarea>
      <div><button class="btn btn-dark" type="button" id="saveBtn">儲存狀態與備註</button></div>
    </div>`;
  bindSave(r);
}
function renderDetail(r){
  if(MODE==="book") return renderBook(r);
  const st=r["狀態"]||"未聯繫";
  const pick=pre=>Object.keys(r).filter(k=>k.startsWith(pre)).map(k=>[k.slice(pre.length),r[k]]);
  const idx=pick("指數｜").sort((a,b)=>b[1]-a[1]), ans=pick("題目｜");
  const kv=arr=>`<div class="kv">${arr.map(([k,v,num])=>`<div><span>${k}</span><b class="${num?"num":""}">${esc(show(v))}</b></div>`).join("")}</div>`;
  const ig=(r["Instagram"]||"").replace(/^@/,"");
  const copy=v=>v?`<button class="btn" type="button" data-copy="${esc(v)}">複製</button>`:"<span></span>";
  const unit=(v,u)=>v?`${v} ${u}`:"";
  $("detail").innerHTML=`
    <div class="d-head">
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="btn back" type="button" id="backBtn" style="align-self:flex-start;margin-bottom:6px">← 名單</button>
        <small>${esc(r["填寫時間"])} · 報告編號 ${esc(show(r["報告編號"]))}</small>
        <h2>${esc(nameOf(r))}</h2>
        <span class="typebadge">${TYPE_EM[r["主要型態"]]||""} ${esc(show(r["主要型態"]))}${r["次要型態"]?`　＋ ${esc(r["次要型態"])}`:""}</span>
      </div>
      <div class="status-row"><select id="stSel" aria-label="狀態">${STATUSES.map(s=>`<option ${s===st?"selected":""}>${s}</option>`).join("")}</select></div>
    </div>

    <div class="blk"><h3>聯絡方式 <span class="en">Contact</span></h3>
      <div class="contact">
        <div><span>Email</span><b>${r["Email"]?`<a href="mailto:${esc(r["Email"])}">${esc(r["Email"])}</a>`:"—"}</b>${copy(r["Email"])}</div>
        <div><span>報告寄送</span><b>${esc(show(r["報告寄送"]))}</b><span></span></div>
        ${r["Instagram"]?`<div><span>Instagram</span><b>${esc(r["Instagram"])}</b>${copy(r["Instagram"])}</div>`:""}
        ${/^https:\/\//.test(r["報告連結"]||"")?`<div><span>他的報告</span><b><a href="${esc(r["報告連結"])}" target="_blank" rel="noopener">打開報告 →</a></b><span></span></div>`:""}
      </div>
    </div>

    ${idx.length?`<div class="blk"><h3>型態指數 <span class="en">Type Fingerprint</span></h3><div class="bars">${idx.map(([c,v])=>`<div class="bar"><span>${TYPE_EM[c]||""} ${esc(c)}</span><div class="tr"><div class="fl" style="width:${+v||0}%;background:${+v>=60?"var(--st-new)":+v>=35?"var(--gold)":"var(--line)"}"></div></div><span class="p">${esc(v)}</span></div>`).join("")}</div></div>`:""}

    <div class="blk"><h3>評估數字 <span class="en">Numbers</span></h3>
      ${r["跳過身體數據"]==="是"?`<p class="muted">他跳過了身體數據</p>`:kv([["建議熱量（大卡）",r["建議熱量"],1],["BMI",r["BMI"],1],["基礎代謝",r["基礎代謝"],1],["維持熱量",r["維持熱量"],1]])+kv([["理想體重",r["理想體重"]]])}
    </div>

    <div class="blk"><h3>身體數據 <span class="en">Profile</span></h3>
      ${kv([["性別",r["性別"]],["年齡",unit(r["年齡"],"歲")],["身高",unit(r["身高"],"cm")],["體重",unit(r["體重"],"kg")],["體脂率",unit(r["體脂率"],"%")],["腰圍",unit(r["腰圍"],"cm")],["目標體重",unit(r["目標體重"],"kg")],["目標",r["目標"]],["活動量",r["活動量"]]])}
    </div>

    <div class="blk"><h3>健康與飲食 <span class="en">Health</span></h3>
      ${kv([["飲食型態",r["飲食型態"]],["健康狀況",r["健康狀況"]],["過敏或不吃",r["過敏或不吃"]]])}
    </div>

    ${ans.length?`<div class="blk"><h3>每題作答 <span class="en">Answers</span></h3><div class="answers">${ans.map(([q,a])=>`<div><span>${esc(q)}</span><b style="font-weight:500">${esc(a)}</b></div>`).join("")}</div></div>`:""}

    <div class="blk"><h3>備註 <span class="en">Notes</span></h3>
      <textarea id="note" placeholder="例如：已私訊、約週五回覆菜單">${esc(r["備註"]||"")}</textarea>
      <div><button class="btn btn-dark" type="button" id="saveBtn">儲存狀態與備註</button></div>
    </div>
    ${r["來源連結"]?`<p style="font-size:12px;color:var(--muted)">來源連結參數：${esc(r["來源連結"])}</p>`:""}`;

  bindSave(r);
}
</script>

</body>
</html>
