<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>預約一對一營養諮詢｜營養師彥彥 Brighter Me</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Playfair+Display:ital@1&family=DM+Mono&display=swap">
<style>
:root{color-scheme:light;--bg:#FFF7F9;--panel2:#FFF0F4;--ink:#2E1A24;--muted:#7D6470;--faint:#B49AA6;--line:#F5DCE5;--pink:#FF5C8D;--rose:#FF3D7A;--tint:#FFE6EE;--bad:#E5484D;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;--f-num:"DM Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;
  background:radial-gradient(60% 40% at 100% 0%,rgba(255,179,138,.22),transparent 70%),radial-gradient(50% 35% at 0% 20%,rgba(201,168,255,.18),transparent 70%),var(--bg);background-attachment:fixed}
h1,h2,p{margin:0}
[hidden]{display:none!important}
.bar{position:fixed;top:0;left:0;right:0;height:4px;background:var(--line);z-index:10}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--rose));transition:width .35s}
.brand{position:fixed;top:14px;left:max(20px,env(safe-area-inset-left,0px));font-size:13px;color:var(--muted);z-index:10}
.brand b{color:var(--ink)}.brand i{font-family:"Playfair Display",serif;color:var(--rose);margin-left:6px}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:70px max(22px,env(safe-area-inset-left,0px)) 90px}
.q{width:100%;max-width:620px;animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.num{font-family:var(--f-num);color:var(--rose);font-size:14px;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.q h2{font-size:clamp(22px,5.4vw,30px);font-weight:900;line-height:1.4}
.q h2 .req{color:var(--rose)}
.q .hint{color:var(--muted);font-size:15px;margin-top:8px}
.field{margin-top:26px}
.txt{width:100%;border:0;border-bottom:2px solid var(--line);background:transparent;font:inherit;font-size:22px;padding:8px 2px;color:var(--ink);outline:0}
.txt:focus{border-bottom-color:var(--pink)}
textarea.txt{font-size:18px;min-height:110px;resize:vertical;border:2px solid var(--line);border-radius:16px;padding:12px 14px}
textarea.txt:focus{border-color:var(--pink)}
.opts{display:flex;flex-direction:column;gap:10px;max-width:440px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;text-align:left;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--pink)}
.opt .k{flex:0 0 26px;height:26px;border:1.5px solid var(--faint);border-radius:7px;display:grid;place-items:center;font-family:var(--f-num);font-size:12px;color:var(--muted)}
.opt.on{border-color:var(--rose);background:var(--tint)}
.opt.on .k{background:var(--rose);border-color:var(--rose);color:#fff}
.act{margin-top:24px;display:flex;align-items:center;gap:14px}
.ok{border:0;border-radius:99px;padding:13px 28px;font:inherit;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(135deg,var(--pink),var(--rose));box-shadow:0 10px 28px rgba(255,61,122,.28);cursor:pointer}
.ok[disabled]{opacity:.6;cursor:progress}
.act small{color:var(--faint);font-size:13px}
.err{color:var(--bad);font-size:14px;margin-top:12px}
.intro .who{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.intro .who img{width:68px;height:68px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 8px 20px rgba(255,92,141,.2)}
.intro .who b{display:block;font-size:17px}.intro .who small{color:var(--muted);font-size:13px}
.intro h1{font-size:clamp(28px,7vw,40px);font-weight:900;line-height:1.3}
.intro .offer{display:inline-block;margin-top:12px;background:var(--tint);color:var(--rose);border-radius:99px;padding:4px 14px;font-weight:700;font-size:14.5px}
.intro ul{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:8px;color:var(--muted);font-size:15px}
.intro li::before{content:"✓";color:var(--rose);font-weight:900;margin-right:8px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px max(20px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,247,249,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:10}
.nav button{border:1.5px solid var(--rose);border-radius:99px;padding:9px 18px;background:#fff;color:var(--rose);font:inherit;font-weight:700;font-size:14.5px;cursor:pointer}
.nav #down{background:var(--rose);color:#fff}
.nav button[disabled]{opacity:.3;cursor:default}
.nav #pos{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.stage{padding-bottom:110px}
.done{text-align:center}
.done .em{font-size:52px}
.golink{display:inline-block;margin-top:22px;border-radius:99px;padding:14px 26px;font-weight:700;color:#fff;text-decoration:none;background:linear-gradient(135deg,var(--pink),var(--rose));box-shadow:0 10px 28px rgba(255,61,122,.28)}
.sigrow{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-end;gap:14px;text-align:left}
.sigrow .sl{color:var(--rose);font-size:13.5px;line-height:1.7}
.sigrow .me{display:flex;align-items:flex-end;gap:6px;flex:0 0 auto}
.sigrow .face{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 4px 12px rgba(255,92,141,.2)}
.sigrow .sig{width:32px;opacity:.85}
</style>
</head>
<body>
<div class="bar"><i id="bar"></i></div>
<div class="brand"><b>營養師彥彥</b><i>Brighter Me</i></div>
<main class="stage"><div id="screen" class="q"></div></main>
<div class="nav" id="nav"><button type="button" id="up">← 上一題</button><span id="pos"></span><button type="button" id="down">下一題 →</button></div>
<script>
/* ============================================================
   ✏️ 貼上 Google Apps Script 網址（跟檢測網站同一個）
   ============================================================ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0Nxt96fvNhbqZiAakp7eYNWfbSMcsAAE0RSGLydxpFaMZBCofaEoE5UUoWgVhEe4yiA/exec";
const OFFER = "";   // 例如「首次諮詢免費」，留空就不顯示
/* ============================================================ */
const TYPES={P:"高壓緊繃型",E:"情緒飢餓型",N:"作息失衡型",M:"代謝低速型",G:"血糖起伏型",D:"節食耗損型"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const qs=new URLSearchParams(location.search), code=(qs.get("t")||"").toUpperCase();
const A={name:"",via:"",contact:"",type:TYPES[code]||"",goals:[],tried:[],meals:"",worry:"",time:[]};

const Q=[
  {id:"intro"},
  {id:"name",t:"我該怎麼稱呼你？",req:1,kind:"text",ph:"例如：小美",hint:"之後聯絡你時，會用這個名字。"},
  {id:"via",t:"希望用什麼方式聯絡你？",req:1,kind:"one",o:["Instagram 私訊","LINE","Email"]},
  {id:"contact",t:()=>({"Instagram 私訊":"你的 IG 帳號是？","LINE":"你的 LINE ID 是？","Email":"你的 Email 是？"})[A.via]||"你的聯絡帳號是？",req:1,kind:"text",ph:()=>({"Instagram 私訊":"@your_ig","LINE":"LINE ID","Email":"you@example.com"})[A.via]||""},
  {id:"type",t:"你的代謝卡關型態是？",req:1,kind:"one",o:[...Object.values(TYPES),"還沒做檢測／不確定"],hint:"做過代謝卡關檢測的話，選報告上的主要型態。"},
  {id:"goals",t:"這次最想改變的是？",req:1,kind:"many",o:["減脂、瘦下來","改善腰腹和體態","穩定血糖、改善健檢數字","外食也能瘦","改善作息和精神","增肌、雕塑線條"],hint:"可以複選。"},
  {id:"tried",t:"你試過哪些方法？",req:1,kind:"many",o:["少吃、節食","斷食","生酮、低醣","代餐","運動","減肥藥或針劑","都還沒試過"],hint:"可以複選。"},
  {id:"meals",t:"平常三餐大多怎麼解決？",req:1,kind:"one",o:["大多外食","一半外食、一半自己煮","大多自己煮"]},
  {id:"worry",t:"目前最困擾你的是什麼？",req:0,kind:"area",ph:"例如：晚上很容易嘴饞、減了又復胖、聚餐不知道怎麼吃⋯",hint:"選填，寫得越具體，彥彥越能幫你準備。"},
  {id:"time",t:"什麼時段比較方便聯絡你？",req:1,kind:"many",o:["平日白天","平日晚上","週末"],hint:"可以複選。"},
  {id:"done"},
];
let cur=0, sending=false;
const val=id=>({name:A.name,via:A.via,contact:A.contact,type:A.type,goals:A.goals,tried:A.tried,meals:A.meals,worry:A.worry,time:A.time})[id];
const set=(id,v)=>{ A[id]=v; };
const fnv=(x)=>typeof x==="function"?x():x;

function render(){
  const q=Q[cur], last=Q.length-1;
  $("bar").style.width=(cur/last*100)+"%";
  $("up").disabled=cur<=1; $("down").textContent=cur===0?"開始 →":cur===last-1?"送出 →":"下一題 →";
  $("pos").textContent=cur===0?"":`${cur} / ${last-1}`;
  $("nav").hidden=cur===last;
  const s=$("screen"); s.className="q"; void s.offsetWidth; s.className="q";
  if(q.id==="intro"){
    s.innerHTML=`<div class="intro">
      <div class="who"><img src="yan-face.jpg" alt=""><div><b>營養師彥彥</b><small>臺北醫學大學・肥胖研究學會 體重管理營養師</small></div></div>
      <h1>預約一對一<br>營養諮詢</h1>
      ${OFFER?`<span class="offer">${esc(OFFER)}</span>`:""}
      <ul><li>依你的代謝型態，排出先做什麼、後做什麼</li><li>外食、聚餐、加班也做得到的飲食安排</li><li>填寫約 2 分鐘，彥彥會主動聯絡你</li></ul>
      <div class="act"><button class="ok" id="okBtn" type="button">開始填寫 →</button><small>按 Enter 也可以</small></div></div>`;
  } else if(q.id==="done"){
    const tc=Object.keys(TYPES).find(k=>TYPES[k]===A.type);
    const go=tc?`<a class="golink" href="guide.html?t=${tc}">看「${esc(A.type)}」減脂對策 →</a>`:`<a class="golink" href="./">先做代謝卡關檢測 →</a>`;
    s.innerHTML=`<div class="done"><div class="em">💌</div><h2 style="font-size:28px;font-weight:900;margin-top:10px">收到你的預約了，${esc(A.name)}！</h2>
      <p style="color:var(--muted);margin-top:12px">彥彥會在 1–2 個工作天內，用 ${esc(A.via.replace(" 私訊",""))} 聯絡你。<br>這段時間，可以先從對策頁的「這週先做這 3 件事」開始。</p>
      ${go}
      <div class="sigrow"><p class="sl">Lighter every day, brighter every way<br>每天輕盈一點，遇見更閃耀的自己</p><div class="me"><img class="face" src="yan-face.jpg" alt=""><img class="sig" src="sig.png" alt="彥彥"></div></div></div>`;
    return;
  } else {
    const n=Q.slice(1,-1).indexOf(q)+1, v=val(q.id);
    let field="";
    if(q.kind==="text") field=`<input class="txt" id="in" type="text" maxlength="80" placeholder="${esc(fnv(q.ph))}" value="${esc(v)}" autocomplete="off" autocapitalize="off">`;
    else if(q.kind==="area") field=`<textarea class="txt" id="in" maxlength="300" placeholder="${esc(q.ph)}">${esc(v)}</textarea>`;
    else field=`<div class="opts">${q.o.map((o,i)=>{ const on=q.kind==="many"?v.includes(o):v===o; return `<button type="button" class="opt${on?" on":""}" data-v="${esc(o)}"><span class="k">${"ABCDEFGH"[i]}</span>${esc(o)}</button>`; }).join("")}</div>`;
    s.innerHTML=`<div class="num">${n} <span>→</span></div><h2>${esc(fnv(q.t))}${q.req?`<span class="req"> *</span>`:""}</h2>${q.hint?`<p class="hint">${esc(q.hint)}</p>`:""}
      <div class="field">${field}</div><p class="err" id="err" hidden></p>
      <div class="act"><button class="ok" id="okBtn" type="button">${cur===Q.length-2?"送出預約":"OK ✓"}</button><small>${q.kind==="area"?"":"按 Enter 也可以"}</small></div>`;
    const inp=$("in"); if(inp){ inp.addEventListener("input",()=>set(q.id,inp.value)); setTimeout(()=>inp.focus({preventScroll:true}),50); }
    s.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
      const o=b.dataset.v;
      if(q.kind==="many"){ const arr=A[q.id]; if(arr.includes(o)) arr.splice(arr.indexOf(o),1); else { if(o==="都還沒試過") arr.length=0; else if(arr.includes("都還沒試過")) arr.splice(arr.indexOf("都還沒試過"),1); arr.push(o);} s.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",arr.includes(x.dataset.v))); }
      else { set(q.id,o); s.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",x===b)); setTimeout(next,280); }
    }));
  }
  $("okBtn").addEventListener("click",next);
}
function check(){
  const q=Q[cur]; if(!q.req) return "";
  const v=val(q.id);
  if(Array.isArray(v)? !v.length : !String(v).trim()) return q.kind==="text"?"這一題要填喔。":"請至少選一個。";
  if(q.id==="contact"&&A.via==="Email"&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(A.contact.trim())) return "Email 格式好像不對，再檢查一下。";
  return "";
}
async function next(){
  if(sending) return;
  const q=Q[cur];
  if(q.id!=="intro"){ const e=check(); if(e){ const el=$("err"); el.textContent=e; el.hidden=false; return; } }
  if(cur===Q.length-2){ await submit(); }
  if(cur<Q.length-1){ cur++; render(); window.scrollTo({top:0}); }
}
async function submit(){
  sending=true; const b=$("okBtn"); b.disabled=true; b.textContent="送出中…";
  const data={"稱呼":A.name.trim(),"聯絡方式":A.via.replace(" 私訊",""),"聯絡帳號":A.contact.trim(),"型態":A.type,"想改變的":A.goals.join("、"),"試過的方法":A.tried.join("、"),"三餐":A.meals,"最困擾的":A.worry.trim(),"方便時段":A.time.join("、"),"來源":(qs.get("src")||(code?"減脂對策頁":"直接進入")).slice(0,40)};
  if(SCRIPT_URL){ try{ await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"book",data})}); }catch(_){ } }
  sending=false;
}
$("up").addEventListener("click",()=>{ if(cur>0){ cur--; render(); } });
$("down").addEventListener("click",next);
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!(e.target.tagName==="TEXTAREA")&&Q[cur].id!=="done"){ e.preventDefault(); next(); } });
render();
</script>
</body>
</html>
