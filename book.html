<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>預約一對一營養諮詢｜營養師彥彥</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Playfair+Display:ital@1&family=DM+Mono&display=swap">
<style>
:root{color-scheme:light;--bg:#FFF7F9;--panel2:#FFF0F4;--ink:#2E1A24;--muted:#7D6470;--faint:#B49AA6;--line:#F5DCE5;--pink:#FF5C8D;--rose:#FF3D7A;--tint:#FFE6EE;--bad:#E5484D;--good:#22A06B;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.75;-webkit-font-smoothing:antialiased;min-height:100vh;
  background:radial-gradient(60% 40% at 100% 0%,rgba(255,179,138,.22),transparent 70%),radial-gradient(50% 35% at 0% 20%,rgba(201,168,255,.18),transparent 70%),var(--bg)}
h1,p{margin:0}
.wrap{max-width:520px;margin:0 auto;padding:36px max(20px,env(safe-area-inset-left,0px)) 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px 22px;box-shadow:0 14px 40px rgba(255,92,141,.1);display:flex;flex-direction:column;gap:18px}
.top{display:flex;gap:14px;align-items:center}
.top img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid var(--tint)}
.top small{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.14em;color:var(--pink);display:block}
h1{font-size:24px;font-weight:900;line-height:1.3}
.lead{color:var(--muted);font-size:14.5px}
.type{display:inline-block;background:var(--tint);color:var(--rose);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font:inherit;font-size:16px;font-weight:400;color:var(--ink);background:#fff;outline:0}
input[type=text]:focus{border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,92,141,.15)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:11px 6px;font:inherit;font-size:14.5px;cursor:pointer;color:var(--ink)}
.seg button.on{border-color:var(--pink);background:var(--tint);color:var(--rose);font-weight:700}
.btn{border:0;border-radius:99px;padding:17px;font:inherit;font-weight:700;font-size:16.5px;color:#fff;background:linear-gradient(135deg,var(--pink),var(--rose));box-shadow:0 14px 40px rgba(255,61,122,.28);cursor:pointer}
.btn[disabled]{opacity:.6;cursor:progress}
.err{color:var(--bad);font-size:14px;text-align:center}
.note{font-size:12px;color:var(--faint);text-align:center;line-height:1.7}
.done{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:30px}
.done img.sig{width:48px;opacity:.8;align-self:flex-end}
.sl{font-size:13px;color:var(--rose)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <form class="card" id="f" novalidate>
    <div class="top"><img src="yan-face.jpg" alt=""><div><small>Book a consultation</small><h1>預約一對一營養諮詢</h1></div></div>
    <p class="lead">留下稱呼和聯絡方式，彥彥會在 1–2 個工作天內主動聯絡你，一起討論最適合你的減脂計畫。</p>
    <p id="typeLine" hidden>你的型態：<span class="type" id="typeName"></span></p>
    <label class="f">怎麼稱呼你？<input type="text" id="name" maxlength="30" placeholder="例如：小美" autocomplete="nickname"></label>
    <div class="f" style="display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700">希望用什麼方式聯絡你？
      <div class="seg" id="via"><button type="button" data-v="IG" class="on">Instagram</button><button type="button" data-v="LINE">LINE</button><button type="button" data-v="Email">Email</button></div>
    </div>
    <label class="f"><span id="contactLabel">你的 IG 帳號</span><input type="text" id="contact" maxlength="80" placeholder="@your_ig" autocapitalize="off"></label>
    <p class="err" id="err" hidden></p>
    <button class="btn" id="go" type="submit">送出預約 →</button>
    <p class="note">送出代表你同意營養師彥彥使用這些資料聯絡你、安排諮詢，不會提供給第三方，你可以隨時要求刪除。</p>
  </form>

  <section class="card done" id="done" hidden>
    <div class="ok">💌</div>
    <h1>收到你的預約了！</h1>
    <p class="lead">彥彥會在 1–2 個工作天內，用你留下的方式聯絡你。<br>這段時間，可以先從報告裡的「這週先做這 3 件事」開始。</p>
    <p class="sl">Lighter every day, brighter every way<br>每天輕盈一點，遇見更閃耀的自己</p>
    <img class="sig" src="sig.png" alt="彥彥">
  </section>
</div>
<script>
/* ✏️ 貼上 Google Apps Script 網址（跟檢測網站同一個） */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0Nxt96fvNhbqZiAakp7eYNWfbSMcsAAE0RSGLydxpFaMZBCofaEoE5UUoWgVhEe4yiA/exec";
const TYPES={P:"高壓緊繃型",E:"情緒飢餓型",N:"作息失衡型",M:"代謝低速型",G:"血糖起伏型",D:"節食耗損型",B:"穩定平衡型"};
const $=id=>document.getElementById(id);
const q=new URLSearchParams(location.search), code=(q.get("t")||"").toUpperCase();
if(TYPES[code]){ $("typeName").textContent=TYPES[code]; $("typeLine").hidden=false; }
let via="IG";
const LBL={IG:["你的 IG 帳號","@your_ig"],LINE:["你的 LINE ID","LINE ID"],Email:["你的 Email","you@example.com"]};
$("via").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; via=b.dataset.v;
  $("via").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); $("contactLabel").textContent=LBL[via][0]; $("contact").placeholder=LBL[via][1]; });
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const name=$("name").value.trim(), contact=$("contact").value.trim(), err=$("err");
  const fail=m=>{ err.textContent=m; err.hidden=false; }; err.hidden=true;
  if(!name) return fail("請填寫你的稱呼。");
  if(!contact) return fail("請填寫聯絡方式，彥彥才找得到你。");
  if(via==="Email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact)) return fail("Email 格式好像不對，再檢查一下。");
  const b=$("go"); b.disabled=true; b.textContent="送出中…";
  const data={"稱呼":name,"聯絡方式":via,"聯絡帳號":contact,"型態":TYPES[code]||"","來源":(q.get("src")||"減脂對策頁").slice(0,40)};
  if(SCRIPT_URL){ try{ await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"book",data})}); }catch(_){ } }
  $("f").hidden=true; $("done").hidden=false; window.scrollTo({top:0});
});
</script>
</body>
</html>
