<style>
:root{
  color-scheme:light;
  --bg:#FFF7F9; --panel:#fff; --panel2:#FFF0F4; --ink:#2E1A24; --muted:#7D6470; --faint:#B49AA6; --line:#F5DCE5;

}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.8;-webkit-font-smoothing:antialiased;

a{color:inherit}
.g{padding-inline:max(20px,env(safe-area-inset-left,0px))}
.col{max-width:680px;margin:0 auto}
.mono{font-family:var(--f-num);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
.en{font-family:var(--f-en);font-style:italic}
[hidden]{display:none!important}
.nav{position:sticky;top:0;z-index:20;background:rgba(255,247,249,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .col{display:flex;justify-content:space-between;align-items:center;padding-block:14px;gap:10px}
.nav b{font-size:16px}.nav .en{color:var(--rose);font-size:14px;margin-left:8px}
.nav a.ig{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:5px 12px;text-decoration:none;white-space:nowrap}
main{padding-block:28px 60px;display:flex;flex-direction:column;gap:18px}
/* cover */
.cover{border-radius:28px;padding:30px 26px;background:linear-gradient(135deg,#FFE6EE,#FFF3EA);position:relative;overflow:hidden}
.cover .k{display:inline-block;background:#fff;border-radius:99px;padding:4px 12px;font-size:12.5px;color:var(--muted)}
.cover .ic{position:absolute;right:22px;top:22px;width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:36px;box-shadow:0 10px 30px rgba(255,92,141,.15)}
.cover .no{font-family:var(--f-num);color:var(--rose);font-size:14px;margin-top:18px;display:block}
.cover h1{font-size:clamp(32px,8vw,44px)}
.cover .en.nm{color:var(--rose);font-size:17px}
.cover .tag{font-size:16px;margin-top:14px;max-width:30em}
.cover .where{margin-top:16px;display:inline-flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:8px 14px;font-size:13.5px}
.cover .where b{color:var(--rose)}
.block{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:26px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(255,92,141,.06)}
.bh h2{font-size:21px}
.signs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.signs li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;background:var(--panel2);border-radius:14px;padding:10px 14px;font-size:14.5px}

.signs-note{font-size:13px;color:var(--muted)}
.mech{font-size:15px;line-height:1.95}
.mech b{color:var(--rose)}
.plan{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.plan>div{border-radius:20px;padding:16px 18px}
.plan .food{background:var(--panel2)} .plan .life{background:var(--peach)}
.plan h3{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.plan ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}

.sw{background:var(--panel2);border-radius:16px;padding:12px 14px;font-size:14px}

.path{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:center;text-align:center}
.path div{border-radius:16px;padding:14px 8px;font-size:14px;font-weight:700}
.path .ok{background:var(--panel2)} .path .ok small{display:block;font-weight:400;color:var(--good);font-size:12px}
.path .q{background:linear-gradient(135deg,var(--pink),var(--rose));color:#fff} .path .q small{display:block;font-weight:400;font-size:12px;opacity:.85}
.path span{color:var(--faint)}
.eq{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.eq span{background:var(--ink);color:#fff;border-radius:99px;padding:6px 16px;font-size:14px;font-weight:700}
.qs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.qs li{background:var(--panel2);border-radius:14px;padding:11px 14px;font-size:14.5px}
.qs li::before{content:"？";color:var(--rose);font-weight:900;margin-right:6px}
.offer{border-radius:28px;padding:28px 24px;background:linear-gradient(135deg,#FFE6EE,#FFF3EA);display:flex;flex-direction:column;gap:14px;border:1px solid var(--pink)}
.offer .who{display:flex;gap:14px;align-items:center}
.offer .who img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid #fff}
.offer .who b{font-size:18px;display:block}.offer .who small{color:var(--muted);font-size:13px}
.offer ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.offer li{background:#fff;border-radius:14px;padding:10px 14px;font-size:14px}
.offer li b{display:block;color:var(--rose);font-size:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:99px;padding:17px 24px;font-weight:700;font-size:16.5px;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--pink),var(--rose));box-shadow:0 14px 40px rgba(255,61,122,.28);animation:hop 2.6s ease-in-out infinite}
@keyframes hop{0%,60%,100%{transform:translateY(0)}68%{transform:translateY(-7px)}76%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.btn{animation:none}}
.small{font-size:12.5px;color:var(--muted);text-align:center}
.sign{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-size:13px;color:var(--rose)}
.sign img{width:44px;opacity:.8}
footer{font-size:12px;color:var(--faint);text-align:center;padding:10px 0 40px}
.notfound{text-align:center;padding:60px 0}
@media (max-width:560px){.plan,.swaps,.offer ul{grid-template-columns:1fr}.week{grid-template-columns:1fr}.path{grid-template-columns:1fr;}.path span{transform:rotate(90deg)}.cover .ic{width:56px;height:56px;font-size:28px}}
</style>
